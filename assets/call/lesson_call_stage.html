<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #fff;
        font-family: sans-serif;
      }
      body {
        position: relative;
      }
      .grid {
        box-sizing: border-box;
        display: grid;
        height: 100%;
        align-content: start;
        gap: 12px;
        overflow-y: auto;
        padding: 12px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .grid.cover {
        display: none;
      }
      .tile {
        position: relative;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 16px;
        background: #1d2939;
      }
      .grid.talk {
        display: flex;
      }
      .grid.talk .tile {
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
      }
      .tile video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }
      .tile video.screen {
        object-fit: contain;
      }
      .dot {
        position: absolute;
        top: 0.7rem;
        inset-inline-end: 0.7rem;
        z-index: 2;
        width: 0.7rem;
        height: 0.7rem;
        border: 2px solid #fff;
        border-radius: 999px;
        background: #12b76a;
        box-shadow: 0 0 0 1px rgb(0 0 0 / 0.28);
      }
      .caption {
        position: absolute;
        inset-inline: 0;
        bottom: 0;
        z-index: 2;
        padding: 8px 10px;
        background: linear-gradient(transparent, rgb(0 0 0 / 0.55));
      }
      .name,
      .meta {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .name {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.25;
      }
      .meta {
        margin-top: 2px;
        font-size: 12px;
        line-height: 1.25;
      }
      .board {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 4;
        background: #fff;
        touch-action: none;
      }
      .board.on {
        display: block;
      }
      #board-note {
        display: none; position: absolute; z-index: 5; inset-inline: 12px;
        bottom: 64px; padding: 8px; border-radius: 10px; color: #57534e;
        background: #fafaf9e8; pointer-events: none; font-size: 12px;
      }
      #board-retry { pointer-events: auto; border: 0; background: transparent; text-decoration: underline; color: inherit; padding: 8px; min-height: 44px; min-width: 44px; }
      #board-announcement { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      .board .excalidraw,
      .board .excalidraw-container {
        width: 100%;
        height: 100%;
      }
      .board .main-menu-trigger,
      .board .help-icon,
      .board .sidebar-trigger,
      .board .sidebar-trigger__label-element,
      .board .App-toolbar__extra-tools-trigger,
      .board .App-toolbar__divider,
      .board .ToolIcon__penMode,
      .board .ToolIcon__lock,
      .board .App-toolbar .ToolIcon:not(.Shape),
      .board .Shape:not(:has([data-testid="toolbar-freedraw"])):not(:has([data-testid="toolbar-eraser"])) {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="grid" class="grid"></div>
    <div id="board" class="board"></div>
    <div id="board-note" aria-live="off"><span id="board-status-text"></span><button id="board-retry" type="button" onclick="retryBoard()"></button></div>
    <div id="board-announcement" role="status" aria-live="polite" aria-atomic="true"></div>
    <script>
      var connection = null;
      var room = null;
      var localVideo = null;
      var localAudio = null;
      var localDesktop = null;
      var videoMuted = true;
      var audioMuted = true;
      var shareState = "idle";
      var shareGeneration = 0;
      var shareStartedAt = 0;
      var shareSlots = {};
      var joining = false;
      var leaving = false;
      var callJoined = false;
      var linkPhase = "idle";
      var linkAuto = true;
      var linkAutoAt = 0;
      var linkTimer = null;
      var passHold = null;
      var remoteAudios = [];
      var opening = { video: false, audio: false };
      var wishMuted = { video: true, audio: true };
      var deviceAllowed = { video: true, audio: true };
      var captureGen = { video: 0, audio: 0 };
      var pending = { video: null, audio: null };
      var tileNodes = {};
      var renewing = false;
      var libraryReady = false;
      var attempt = 0;
      var people = {};
      var teacherIds = [];
      var teacherPrimary = "";
      var ownName = "";
      var shownMode = "grid";
      var boardParts = [];
      var boardSourceChars = 0;
      var boardInstalled = false;
      var boardEnded = false;
      var boardRoster = null;
      var boardRosterAt = 0;
      var boardInbox = [];
      var boardInboxBytes = 0;
      var boardInboxTimer = null;
      var boardState = "waiting";
      var boardLabels = {};
      var boardDetails = {};
      var boardNoticeText = "";
      var boardNoticeTimer = null;
      var speakerId = "";
      var workspaceSlots = {};
      var localEndpoint = "";
      var youLabel = "";
      var cameraOffLabel = "";
      var onlineLabel = "";
      var nameLocale = "ru";
      var band = false;
      var mediaAppliedAt = { audio: 0, video: 0 };
      var mediaHold = { audio: null, video: null };
      var mediaSkewMs = 15 * 60 * 1000;

      function post(kind, detail) {
        var bridge = window.flutter_inappwebview;
        if (bridge && bridge.callHandler) {
          bridge.callHandler("lessonCall", { kind: kind, detail: detail || "" });
        }
      }

      function attach(track, element) {
        if (!track || !element) {
          return;
        }
        if (typeof track.attach === "function") {
          track.attach(element);
        } else if (track.stream) {
          element.srcObject = track.stream;
        }
      }

      function playMedia(element, onBlocked) {
        if (!element || !element.play) {
          return;
        }
        element.play().catch(function () {
          if (onBlocked) {
            onBlocked();
          }
        });
      }

      function attachRemoteAudio(track) {
        var audio = document.createElement("audio");
        audio.autoplay = true;
        audio.setAttribute("playsinline", "");
        document.body.appendChild(audio);
        remoteAudios.push(audio);
        attach(track, audio);
        playMedia(audio, function () {
          post("hear-blocked");
        });
      }

      function blockOf(error) {
        var name = error && error.name ? String(error.name) : "";
        if (
          name.indexOf("permission_denied") >= 0 ||
          name === "NotAllowedError" ||
          name === "PermissionDeniedError" ||
          name === "SecurityError"
        ) {
          return "denied";
        }
        if (
          name.indexOf("not_found") >= 0 ||
          name === "NotFoundError" ||
          name === "NotReadableError" ||
          name === "DevicesNotFoundError"
        ) {
          return "missing";
        }
        return "failed";
      }

      function ensurePerson(id, local) {
        if (!people[id]) {
          people[id] = {
            id: id,
            name: "",
            local: local,
            camera: null,
            desktop: null,
            sharing: false,
            shareStartedAt: null,
            videoMuted: true,
          };
        }
        return people[id];
      }

      function shownTrack(person) {
        return person.desktop || person.camera;
      }

      function sameCallName(left, right) {
        var normalize = function (value) {
          return String(value || "")
            .replace(/\s+/g, " ")
            .trim()
            .toLocaleLowerCase();
        };
        var normalizedLeft = normalize(left);
        var normalizedRight = normalize(right);
        return normalizedLeft.length > 0 && normalizedLeft === normalizedRight;
      }

      function knownTeacher(id) {
        return teacherIds.indexOf(id) >= 0;
      }

      function orderedPeople() {
        var local = null;
        var remotes = [];
        for (var id in people) {
          if (people[id].local) {
            local = people[id];
          } else if (!sameCallName(people[id].name, ownName)) {
            remotes.push(people[id]);
          }
        }
        remotes.sort(function (left, right) {
          var leftTeacher = knownTeacher(left.id) ? 0 : 1;
          var rightTeacher = knownTeacher(right.id) ? 0 : 1;
          if (leftTeacher !== rightTeacher) {
            return leftTeacher - rightTeacher;
          }
          return (left.name || "").localeCompare(right.name || "", nameLocale);
        });
        return local ? [local].concat(remotes) : remotes;
      }

      function personById(tiles, id) {
        if (!id) {
          return null;
        }
        for (var i = 0; i < tiles.length; i++) {
          if (tiles[i].id === id) {
            return tiles[i];
          }
        }
        return null;
      }

      function talkTiles(tiles) {
        if (shownMode !== "talk") {
          return tiles;
        }
        var sharer = null;
        var sharerAt = 0;
        for (var i = 0; i < tiles.length; i++) {
          var candidate = tiles[i];
          if (!candidate.sharing) {
            continue;
          }
          var started = candidate.shareStartedAt > 0 ? candidate.shareStartedAt : 9007199254740991;
          if (!sharer || started < sharerAt || (started === sharerAt && candidate.id < sharer.id)) {
            sharer = candidate;
            sharerAt = started;
          }
        }
        if (sharer) {
          return [sharer];
        }
        var speaker = personById(tiles, speakerId);
        if (speaker) {
          return [speaker];
        }
        var teacher = personById(tiles, teacherPrimary);
        if (teacher) {
          return [teacher];
        }
        var local = personById(tiles, "local");
        return local ? [local] : [];
      }

      function releaseTrack(track) {
        if (!track) {
          return;
        }
        try {
          if (typeof track.detach === "function") {
            track.detach();
          }
        } catch (error) {}
        try {
          if (typeof track.dispose === "function") {
            track.dispose();
          }
        } catch (error) {}
      }

      function detachVideo(node) {
        if (!node || !node.video) {
          return;
        }
        var track = node.track;
        var video = node.video;
        node.video = null;
        node.track = null;
        try {
          if (track && typeof track.detach === "function") {
            track.detach(video);
          }
        } catch (error) {}
        if (video.parentNode) {
          video.parentNode.removeChild(video);
        }
      }

      function createTile() {
        var tile = document.createElement("div");
        tile.className = "tile";
        var dot = document.createElement("span");
        dot.className = "dot";
        dot.setAttribute("role", "img");
        var caption = document.createElement("div");
        caption.className = "caption";
        var name = document.createElement("div");
        name.className = "name";
        caption.appendChild(name);
        tile.appendChild(dot);
        tile.appendChild(caption);
        return { tile: tile, dot: dot, caption: caption, name: name, meta: null, video: null, track: null };
      }

      function updateTile(node, person) {
        var label = person.local ? youLabel : person.name || "";
        if (node.name.textContent !== label) {
          node.name.textContent = label;
        }
        if (node.dot.getAttribute("aria-label") !== onlineLabel) {
          node.dot.setAttribute("aria-label", onlineLabel);
        }
        var videoTrack = shownTrack(person);
        var show = Boolean(videoTrack) && (person.sharing || !person.videoMuted);
        if (!show) {
          detachVideo(node);
          if (!node.meta) {
            node.meta = document.createElement("div");
            node.meta.className = "meta";
            node.caption.appendChild(node.meta);
          }
          if (node.meta.textContent !== cameraOffLabel) {
            node.meta.textContent = cameraOffLabel;
          }
          return;
        }
        if (node.meta && node.meta.parentNode) {
          node.meta.parentNode.removeChild(node.meta);
          node.meta = null;
        }
        if (node.track === videoTrack && node.video) {
          return;
        }
        detachVideo(node);
        var video = document.createElement("video");
        video.autoplay = true;
        video.muted = true;
        video.className = videoTrack === person.desktop ? "screen" : "";
        video.setAttribute("playsinline", "");
        node.tile.insertBefore(video, node.tile.firstChild);
        node.video = video;
        node.track = videoTrack;
        attach(videoTrack, video);
        playMedia(video);
      }

      function render() {
        var root = document.getElementById("grid");
        if (!root) {
          return;
        }
        root.className = "grid" + (band ? " cover" : "") + (shownMode === "talk" && !band ? " talk" : "");
        var tiles = band ? [] : talkTiles(orderedPeople());
        var keep = {};
        for (var i = 0; i < tiles.length; i++) {
          var person = tiles[i];
          keep[person.id] = true;
          var node = tileNodes[person.id];
          if (!node) {
            node = createTile();
            tileNodes[person.id] = node;
          }
          updateTile(node, person);
          var current = root.children[i];
          if (node.tile.parentNode !== root) {
            root.appendChild(node.tile);
          }
          if (root.children[i] !== node.tile) {
            root.insertBefore(node.tile, current || null);
          }
        }
        for (var id in tileNodes) {
          if (keep[id]) {
            continue;
          }
          detachVideo(tileNodes[id]);
          if (tileNodes[id].tile.parentNode) {
            tileNodes[id].tile.parentNode.removeChild(tileNodes[id].tile);
          }
          delete tileNodes[id];
        }
        syncBoard();
      }

      function rememberVideo(track) {
        var local = track.isLocal();
        var id = local ? "local" : track.getParticipantId && track.getParticipantId();
        if (!id) {
          return;
        }
        var person = ensurePerson(id, local);
        if (track.getVideoType && track.getVideoType() === "desktop") {
          person.desktop = track;
          person.sharing = true;
          var announced = shareSlots[id];
          person.shareStartedAt = announced && announced.sharing ? announced.startedAt : person.shareStartedAt || Date.now();
          if (announced && announced.sharing) {
            person.videoMuted = announced.cameraMuted;
          }
          if (local) {
            localDesktop = track;
            post("share-on");
          }
        } else {
          person.camera = track;
          person.videoMuted = track.isMuted();
          if (local) {
            localVideo = track;
            videoMuted = person.videoMuted;
          }
        }
        render();
      }

      function endpointKey(id) {
        if (typeof id !== "string") {
          return "";
        }
        var slash = id.lastIndexOf("/");
        return (slash >= 0 ? id.slice(slash + 1) : id).trim();
      }

      function senderId(from) {
        if (typeof from === "string") {
          return endpointKey(from);
        }
        if (from && from.getId) {
          return endpointKey(from.getId());
        }
        return "";
      }

      function readCommand(payload) {
        var value = payload;
        if (typeof value === "string") {
          try {
            value = JSON.parse(value);
          } catch (error) {
            return null;
          }
        }
        if (!value || typeof value !== "object") {
          return null;
        }
        if (value.kind !== "larnes-media") {
          return null;
        }
        if (value.device !== "audio" && value.device !== "video") {
          return null;
        }
        if (typeof value.muted !== "boolean") {
          return null;
        }
        if (typeof value.sentAt !== "number" || !isFinite(value.sentAt) || Math.floor(value.sentAt) !== value.sentAt || value.sentAt <= 0) {
          return null;
        }
        if (typeof value.target !== "string" || value.target.length < 1 || value.target.length > 128) {
          return null;
        }
        return value;
      }

      function decideCommand(command, sender) {
        if (!localEndpoint || !sender || sender === localEndpoint) {
          return "drop";
        }
        if (command.target !== localEndpoint || teacherIds.indexOf(localEndpoint) >= 0) {
          return "drop";
        }
        if (command.sentAt <= mediaAppliedAt[command.device] || command.sentAt > Date.now() + mediaSkewMs) {
          return "drop";
        }
        if (teacherIds.length === 0) {
          return "wait";
        }
        if (teacherIds.indexOf(sender) >= 0) {
          return "apply";
        }
        return "drop";
      }

      function commandText(payload) {
        if (typeof payload === "string") {
          return payload;
        }
        if (!payload || typeof payload !== "object") {
          return "";
        }
        if (typeof payload.value === "string") {
          return payload.value;
        }
        if (payload.attributes && typeof payload.attributes.value === "string") {
          return payload.attributes.value;
        }
        return "";
      }

      function readWorkspace(payload) {
        var text = commandText(payload);
        if (!text) {
          return null;
        }
        var parsed;
        try {
          parsed = JSON.parse(text);
        } catch (error) {
          return null;
        }
        if (!parsed || (parsed.mode !== "grid" && parsed.mode !== "talk" && parsed.mode !== "workflow")) {
          return null;
        }
        if (typeof parsed.sentAt !== "number" || !isFinite(parsed.sentAt)) {
          return null;
        }
        return parsed;
      }

      function emitWorkspace() {
        var best = null;
        for (var id in workspaceSlots) {
          if (!knownTeacher(id)) {
            continue;
          }
          var slot = workspaceSlots[id];
          if (!best || slot.sentAt >= best.sentAt) {
            best = slot;
          }
        }
        var mode = best ? best.mode : "grid";
        if (mode === shownMode) {
          return;
        }
        shownMode = mode;
        post("mode", mode);
        render();
      }

      function readWorkspaceSlot(payload) {
        if (payload && payload.kind === "larnes-workspace") {
          if (payload.mode !== "grid" && payload.mode !== "talk" && payload.mode !== "workflow") {
            return null;
          }
          if (!whole(payload.sentAt) || payload.sentAt <= 0) {
            return null;
          }
          return payload;
        }
        return readWorkspace(payload);
      }

      function applyWorkspace(participantId, payload) {
        var id = endpointKey(participantId);
        if (!id) {
          return;
        }
        var slot = readWorkspaceSlot(payload);
        if (!slot) {
          return;
        }
        var current = workspaceSlots[id];
        if (current && current.sentAt >= slot.sentAt) {
          return;
        }
        workspaceSlots[id] = slot;
        emitWorkspace();
      }

      function whole(value) {
        return typeof value === "number" && isFinite(value) && Math.floor(value) === value;
      }

      // Only the bundle owns v2 schema/assembly/access/scene. HTML forwards actual Jitsi senders.
      function syncBoardChannel() {
        if (!boardInstalled || boardEnded) return;
        var active = [];
        if (callJoined && localEndpoint) active.push(localEndpoint);
        if (room && room.getParticipants) {
          var members = room.getParticipants();
          for (var i = 0; i < members.length; i++) {
            var id = senderId(members[i]);
            if (id) active.push(id);
          }
        }
        var scope = passHold && typeof passHold.room === "string" ? passHold.room.trim().toLowerCase() : "";
        window.LarnesBoard.bind(scope && localEndpoint ? {
          scopeId: scope, room: room, endpointId: localEndpoint, active: active,
          connected: callJoined && linkPhase === "room",
          roster: boardRoster, rosterAgeMs: boardRosterAt ? Math.max(0, Date.now() - boardRosterAt) : Infinity
        } : null);
      }

      function setBoardRoster(roster, endpoint) {
        if (boardEnded || !localEndpoint || endpoint !== localEndpoint) return;
        boardRoster = roster;
        boardRosterAt = Date.now();
        syncBoardChannel();
      }

      function clearBoardInbox() {
        if (boardInboxTimer !== null) window.clearTimeout(boardInboxTimer);
        boardInboxTimer = null; boardInbox = []; boardInboxBytes = 0;
      }

      function receiveBoard(sender, payload) {
        if (boardEnded || !sender || sender.length > 200 || sender === localEndpoint) return;
        if (boardInstalled) { window.LarnesBoard.receive(sender, payload); return; }
        var bytes;
        try { bytes = new TextEncoder().encode(JSON.stringify(payload)).length; } catch (_) { return; }
        // Pre-install buffer is raw bounded packets, NOT another assembly/algorithm.
        if (bytes > 16384) return;
        if (boardInbox.length && Date.now() - boardInbox[0].at > 5000) clearBoardInbox();
        while (boardInbox.length && (boardInbox.length >= 64 || boardInboxBytes + bytes > 262144)) {
          boardInboxBytes -= boardInbox.shift().bytes;
        }
        boardInbox.push({ sender: sender, payload: payload, bytes: bytes, at: Date.now() });
        boardInboxBytes += bytes;
        if (boardInboxTimer === null) boardInboxTimer = window.setTimeout(clearBoardInbox, 5000);
      }

      function updateBoardNotice() {
        var note = document.getElementById("board-note");
        if (!note) return;
        var open = shownMode === "workflow" && !band;
        var text = boardLabels[boardState] || "";
        if (boardDetails.hydrated && !boardDetails.writable && boardDetails.mode === "teacher" && (boardState === "ready" || boardState === "recovering")) text += " " + (boardLabels.readOnly || "");
        document.getElementById("board-status-text").textContent = text;
        var retry = document.getElementById("board-retry");
        retry.textContent = boardLabels.retry || "";
        retry.style.display = boardDetails.canRetry && retry.textContent ? "inline-block" : "none";
        note.style.display = open && text ? "block" : "none";
        var announcement = open ? text : "";
        if (announcement !== boardNoticeText) {
          boardNoticeText = announcement;
          if (boardNoticeTimer !== null) window.clearTimeout(boardNoticeTimer);
          boardNoticeTimer = window.setTimeout(function () {
            boardNoticeTimer = null;
            document.getElementById("board-announcement").textContent = boardNoticeText;
          }, 600);
        }
      }

      function retryBoard() { if (boardInstalled) window.LarnesBoard.retry(); }

      function syncBoard() {
        var host = document.getElementById("board");
        if (!host) return;
        var open = shownMode === "workflow" && !band;
        host.className = open ? "board on" : "board";
        if (boardInstalled) window.LarnesBoard.setVisible(open);
        updateBoardNotice();
        if (open && boardInstalled) window.requestAnimationFrame(function () { window.LarnesBoard.refresh(); });
      }

      function installBoard(part, last) {
        // A repeated Flutter load-stop never creates a second root/controller.
        if (boardInstalled || boardEnded) return;
        if (typeof part === "string" && part) {
          boardSourceChars += part.length;
          if (boardParts.length >= 64 || boardSourceChars > 12 * 1024 * 1024) {
            boardParts = []; boardSourceChars = 0; boardState = "offline"; updateBoardNotice(); return;
          }
          boardParts.push(part);
        }
        if (!last) return;
        var code = boardParts.join("");
        boardParts = []; boardSourceChars = 0;
        try { (0, eval)(code); } catch (_) { boardState = "offline"; updateBoardNotice(); return; }
        if (!window.LarnesBoard || window.LarnesBoard.version !== 2) {
          boardState = "unsupported"; updateBoardNotice(); return;
        }
        boardInstalled = true;
        window.LarnesBoard.onStatus = function (state, details) { if (boardEnded) return; boardState = state; boardDetails = details || {}; updateBoardNotice(); };
        window.LarnesBoard.setPresenceLabels({ teacher: boardLabels.presenceTeacher, participant: boardLabels.presenceParticipant });
        window.LarnesBoard.setLocale(nameLocale);
        window.LarnesBoard.mount(document.getElementById("board"));
        syncBoardChannel();
        var inbox = boardInbox.slice();
        clearBoardInbox();
        for (var i = 0; i < inbox.length; i++) {
          if (Date.now() - inbox[i].at <= 5000) window.LarnesBoard.receive(inbox[i].sender, inbox[i].payload);
        }
        // Shared session negotiates capabilities and requests a fresh correlated snapshot on API ready.
        syncBoard();
      }

      function onEndpointMessage(from, payload) {
        var raw = payload;
        if (typeof raw === "string") {
          if (raw.length > 16384) return;
          try {
            raw = JSON.parse(raw);
          } catch (error) {
            raw = payload;
          }
        }
        if (raw && raw.kind === "larnes-workspace") {
          var workspaceSender = senderId(from);
          if (workspaceSender && workspaceSender !== localEndpoint) {
            applyWorkspace(workspaceSender, raw);
          }
          return;
        }

      }

      function clearLinkTimer() {
        if (linkTimer) {
          clearTimeout(linkTimer);
          linkTimer = null;
        }
      }

      function armLinkTimer() {
        if (linkTimer) {
          return;
        }
        linkTimer = setTimeout(function () {
          linkTimer = null;
          if (leaving) {
            return;
          }
          var step = linkTimeout(Date.now());
          if (step) {
            applyLink(step);
          }
        }, 45000);
      }

      function postLinkPhase() {
        var ui =
          linkPhase === "reconnecting" || linkPhase === "rejoining"
            ? "reconnecting"
            : linkPhase === "lost"
              ? "lost"
              : "room";
        post("link", ui);
      }

      function applyLink(step) {
        if (!step || (linkSame(step) && !step.wait && !step.rejoin)) {
          return;
        }
        linkPhase = step.phase;
        linkAuto = step.auto;
        linkAutoAt = step.at;
        if (step.wait) {
          armLinkTimer();
        } else {
          clearLinkTimer();
        }
        postLinkPhase();
        syncBoardChannel();
        if (step.rejoin) {
          beginRejoin();
        }
      }

      function linkInterrupted() {
        if (linkPhase !== "room") {
          return null;
        }
        return { phase: "reconnecting", auto: linkAuto, at: linkAutoAt, wait: true, rejoin: false };
      }

      function linkRestored() {
        if (linkPhase !== "reconnecting" && linkPhase !== "rejoining") {
          return null;
        }
        return { phase: "room", auto: true, at: 0, wait: false, rejoin: false };
      }

      function linkCanAuto(now) {
        return linkAuto && (linkAutoAt === 0 || now - linkAutoAt >= 45000);
      }

      function linkGaveUp(now) {
        if (linkPhase !== "room" && linkPhase !== "reconnecting") {
          return null;
        }
        if (!linkCanAuto(now)) {
          return { phase: "lost", auto: false, at: linkAutoAt, wait: false, rejoin: false };
        }
        return { phase: "rejoining", auto: false, at: now, wait: false, rejoin: true };
      }

      function linkTimeout(now) {
        if (linkPhase !== "reconnecting") {
          return null;
        }
        var saved = linkPhase;
        linkPhase = "room";
        var step = linkGaveUp(now);
        if (!step) {
          linkPhase = saved;
        }
        return step;
      }

      function linkJoined() {
        return { phase: "room", auto: true, at: linkAutoAt, wait: false, rejoin: false };
      }

      function linkEntranceFailed() {
        return { phase: "lost", auto: false, at: linkAutoAt, wait: false, rejoin: false };
      }

      function linkRetry() {
        if (linkPhase !== "lost") {
          return null;
        }
        return { phase: "rejoining", auto: false, at: linkAutoAt, wait: false, rejoin: true };
      }

      function noteJoinFailure() {
        joining = false;
        if (linkPhase === "rejoining") {
          applyLink(linkEntranceFailed());
          return;
        }
        post("failed");
      }

      function noteRoomFailure() {
        if (!callJoined) {
          noteJoinFailure();
          return;
        }
        var step = linkGaveUp(Date.now());
        if (step) {
          applyLink(step);
        }
      }

      function retryLink() {
        var step = linkRetry();
        if (step) {
          applyLink(step);
        }
      }

      function beginRejoin() {
        rejoin();
      }

      function rejoin() {
        if (renewing || leaving) {
          return;
        }
        renewing = true;
        post("renew");
      }

      function renewFailed(code) {
        renewing = false;
        if (code === "inactive" || code === "forbidden") closeBoard();
        var wasLive = callJoined || linkPhase === "rejoining" || linkPhase === "reconnecting";
        dropSession();
        if (code === "inactive") {
          post("closed");
          return;
        }
        if (wasLive) {
          applyLink(linkEntranceFailed());
          return;
        }
        post("failed");
      }

      function dropSession() {
        attempt += 1;
        captureGen.video += 1;
        captureGen.audio += 1;
        opening.video = false;
        opening.audio = false;
        wishMuted.video = true;
        wishMuted.audio = true;
        videoMuted = true;
        audioMuted = true;
        var paused = leaving;
        leaving = true;
        var currentRoom = room;
        var currentConnection = connection;
        room = null;
        connection = null;
        joining = false;
        callJoined = false;
        releaseTrack(pending.video);
        releaseTrack(pending.audio);
        pending.video = null;
        pending.audio = null;
        releaseDesktop();
        shareSlots = {};
        releaseTrack(localVideo);
        releaseTrack(localAudio);
        localVideo = null;
        localAudio = null;
        people = {};
        boardRoster = null;
        boardRosterAt = 0;
        clearBoardInbox();
        if (boardInstalled) window.LarnesBoard.bind(null);
        mediaHold = { audio: null, video: null };
        speakerId = "";
        localEndpoint = "";
        for (var id in tileNodes) {
          detachVideo(tileNodes[id]);
          if (tileNodes[id].tile.parentNode) {
            tileNodes[id].tile.parentNode.removeChild(tileNodes[id].tile);
          }
          delete tileNodes[id];
        }
        for (var i = 0; i < remoteAudios.length; i++) {
          var audio = remoteAudios[i];
          try {
            audio.srcObject = null;
          } catch (error) {}
          if (audio.parentNode) {
            audio.parentNode.removeChild(audio);
          }
        }
        remoteAudios = [];
        var left = Promise.resolve();
        if (currentRoom && currentRoom.leave) {
          try {
            var result = currentRoom.leave();
            if (result && typeof result.then === "function") {
              left = result;
            }
          } catch (error) {}
        }
        leaving = paused;
        post("camera-off");
        post("mic-off");
        return left.then(
          function () {
            disconnectCall(currentConnection);
          },
          function () {
            disconnectCall(currentConnection);
          },
        );
      }

      function disconnectCall(currentConnection) {
        if (currentConnection && currentConnection.disconnect) {
          try {
            currentConnection.disconnect();
          } catch (error) {}
        }
      }

      function acceptPass(pass) {
        renewing = false;
        if (!pass || !hostName(pass.domain) || !hostName(pass.xmppDomain)) {
          post("failed");
          return;
        }
        passHold = pass;
        dropSession().then(function () {
          if (leaving) {
            return;
          }
          join(pass);
        });
      }

      function leave() {
        closeBoard();
        clearLinkTimer();
        renewing = false;
        leaving = true;
        return dropSession().then(
          function () {
            post("left");
          },
          function () {
            post("left");
          },
        );
      }

      // A reconnect only detaches. Existing terminal/leave decisions close the
      // document owner immediately; stale roster/asset callbacks cannot reopen it.
      function closeBoard() {
        if (boardEnded) return;
        boardEnded = true;
        clearBoardInbox(); boardParts = []; boardSourceChars = 0; boardRoster = null;
        if (boardNoticeTimer !== null) window.clearTimeout(boardNoticeTimer);
        boardNoticeTimer = null;
        if (boardInstalled) window.LarnesBoard.endSession();
        document.getElementById("board-note").style.display = "none";
        document.getElementById("board-announcement").textContent = "";
      }
    </script>
  </body>
</html>
